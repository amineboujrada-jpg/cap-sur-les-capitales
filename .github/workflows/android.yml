name: Application Android (APK)

# Fabrique l'APK à chaque envoi sur main (ou à la demande, onglet Actions),
# puis le publie dans « Releases » pour le télécharger depuis le téléphone.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Préparer les fichiers de l'app
        run: |
          mkdir -p build/www
          cp index.html app.js countries.js names.js i18n.js flags.js style.css base.css manifest.webmanifest build/www/
          cp -r assets build/www/
          # Icônes réservées à la version web : inutiles dans l'app Android
          rm -f build/www/assets/icon-512.png build/www/assets/icon-maskable-512.png build/www/assets/apple-touch-icon.png

      - name: Créer le projet Android (Capacitor)
        working-directory: build
        run: |
          npm init -y > /dev/null
          npm install --no-audit --no-fund @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8
          npx cap init "Capitalia" com.amineboujrada.capitalia --web-dir www
          npx cap add android
          npx cap sync android

      - name: Icône et permissions
        working-directory: build/android/app/src/main
        run: |
          rm -rf res/mipmap-anydpi-v26
          cp -r "$GITHUB_WORKSPACE"/android-icons/mipmap-* res/
          grep -q "android.permission.VIBRATE" AndroidManifest.xml || sed -i 's#<application#<uses-permission android:name="android.permission.VIBRATE" />\n    <application#' AndroidManifest.xml

      - name: Numéro de version
        working-directory: build/android/app
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" build.gradle
          grep -E "versionCode|versionName|targetSdk" build.gradle ../variables.gradle || true

      - name: Compiler l'APK et le bundle Play Store (AAB)
        working-directory: build/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Capitalia.apk"
          cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/Capitalia-unsigned.aab"

      # Le bundle est signé ensuite avec la clé d'envoi (jamais stockée dans ce dépôt public).
      - uses: actions/upload-artifact@v4
        with:
          name: Capitalia-aab-non-signe
          path: Capitalia-unsigned.aab

      - uses: actions/upload-artifact@v4
        with:
          name: Capitalia-apk
          path: Capitalia.apk

      - name: Déposer le bundle non signé sur la branche builds
        run: |
          mkdir out && cp Capitalia-unsigned.aab out/ && cd out
          echo "versionCode ${{ github.run_number }} · commit ${{ github.sha }}" > VERSION.txt
          git init -q && git checkout -q -b builds && git add .
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "Bundle ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" builds

      - name: Publier dans Releases
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ github.run_number }}
          name: Application Android ${{ github.run_number }}
          body: |
            APK à installer sur Android (hors Play Store).
            Sur le téléphone : télécharger Capitalia.apk, l'ouvrir, puis autoriser l'installation depuis cette source si Android le demande.
          files: Capitalia.apk
          make_latest: true
